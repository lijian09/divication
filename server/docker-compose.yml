version: '3.8'

services:
  # ========== 应用 ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingyu-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lingyu-network

  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: lingyu-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-lingyu_root_2026}
      MYSQL_DATABASE: ${DB_DATABASE:-lingyu}
      MYSQL_USER: ${DB_USERNAME:-lingyu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lingyu_dev_2026}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-lingyu_root_2026}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lingyu-network

  # ========== Redis 7.x ==========
  redis:
    image: redis:7-alpine
    container_name: lingyu-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lingyu-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  lingyu-network:
    driver: bridge
