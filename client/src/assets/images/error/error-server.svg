<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="es-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E53935;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#es-glow)"/>

  <!-- 服务器机箱 -->
  <g transform="translate(70, 40)">
    <!-- 机箱主体 -->
    <rect x="0" y="0" width="60" height="45" rx="4" fill="none" stroke="#A8A3B8" stroke-width="1.5" opacity="0.6"/>
    <!-- 分隔线 -->
    <line x1="0" y1="15" x2="60" y2="15" stroke="#A8A3B8" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#A8A3B8" stroke-width="0.8" opacity="0.3"/>
    <!-- 指示灯 -->
    <circle cx="10" cy="8" r="2.5" fill="#E53935" opacity="0.8"/>
    <circle cx="10" cy="23" r="2.5" fill="#E53935" opacity="0.8"/>
    <circle cx="10" cy="38" r="2.5" fill="#E53935" opacity="0.8"/>
    <!-- 通风口 -->
    <line x1="25" y1="6" x2="50" y2="6" stroke="#A8A3B8" stroke-width="0.5" opacity="0.3"/>
    <line x1="25" y1="10" x2="50" y2="10" stroke="#A8A3B8" stroke-width="0.5" opacity="0.3"/>
    <line x1="25" y1="21" x2="50" y2="21" stroke="#A8A3B8" stroke-width="0.5" opacity="0.3"/>
    <line x1="25" y1="25" x2="50" y2="25" stroke="#A8A3B8" stroke-width="0.5" opacity="0.3"/>
    <line x1="25" y1="36" x2="50" y2="36" stroke="#A8A3B8" stroke-width="0.5" opacity="0.3"/>
    <line x1="25" y1="40" x2="50" y2="40" stroke="#A8A3B8" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- 第二层服务器 (部分遮挡) -->
  <g transform="translate(75, 88)">
    <rect x="0" y="0" width="60" height="45" rx="4" fill="none" stroke="#A8A3B8" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="15" x2="60" y2="15" stroke="#A8A3B8" stroke-width="0.8" opacity="0.2"/>
    <line x1="0" y1="30" x2="60" y2="30" stroke="#A8A3B8" stroke-width="0.8" opacity="0.2"/>
    <circle cx="10" cy="8" r="2.5" fill="#E53935" opacity="0.5"/>
  </g>

  <!-- 错误 X 标记 -->
  <g transform="translate(155, 55)">
    <circle cx="0" cy="0" r="12" fill="#E53935" opacity="0.8"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 提示文字 -->
  <text x="100" y="165" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="13" fill="#A8A3B8" opacity="0.7">
    服务异常
  </text>
  <text x="100" y="185" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="11" fill="#6B6580" opacity="0.5">
    服务器开小差了，请稍后再试
  </text>
</svg>