      <line x1="230" y1="311.25" x2="230" y2="345" stroke="#8A9BB0" stroke-width="2.25"/>
      <polygon points="230,311.25 226.25,318.75 233.75,318.75" fill="#8A9BB0" opacity="0.8"/>
      <line x1="222.5" y1="333.75" x2="237.5" y2="333.75" stroke="#8A9BB0" stroke-width="1.5"/>
    
