<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 400" width="375" height="400">
  <defs>
    <linearGradient id="ob1-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1B3E;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="ob1-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="ob1-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D68A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="375" height="400" fill="url(#ob1-bg)"/>
  <rect width="375" height="400" fill="url(#ob1-glow)"/>

  <!-- 星星装饰 -->
  <circle cx="50" cy="40" r="1.5" fill="#F0D68A" opacity="0.8"/>
  <circle cx="120" cy="60" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="300" cy="35" r="1.5" fill="#F0D68A" opacity="0.7"/>
  <circle cx="280" cy="80" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="60" cy="100" r="1.2" fill="#F0D68A" opacity="0.6"/>
  <circle cx="340" cy="120" r="1" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="90" cy="150" r="0.8" fill="#F0D68A" opacity="0.5"/>
  <circle cx="320" cy="160" r="1.3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="40" cy="200" r="1" fill="#F0D68A" opacity="0.4"/>
  <circle cx="200" cy="30" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="160" cy="90" r="0.8" fill="#F0D68A" opacity="0.5"/>
  <circle cx="250" cy="50" r="1" fill="#FFFFFF" opacity="0.6"/>

  <!-- 大星形装饰 -->
  <polygon points="187.5,40 191,55 206,55 194,64 198,79 187.5,70 177,79 181,64 169,55 184,55"
           fill="#D4A843" opacity="0.3"/>
  <polygon points="60,130 62,138 70,138 64,143 66,151 60,146 54,151 56,143 50,138 58,138"
           fill="#F0D68A" opacity="0.2"/>
  <polygon points="310,100 312,108 320,108 314,113 316,121 310,116 304,121 306,113 300,108 308,108"
           fill="#F0D68A" opacity="0.2"/>

  <!-- 塔罗牌 - 中间位置 -->
  <g transform="translate(130, 120)">
    <!-- 卡片阴影 -->
    <rect x="8" y="8" width="90" height="140" rx="6" fill="#1A0A2E" opacity="0.5"/>
    <!-- 卡片主体 -->
    <rect x="0" y="0" width="90" height="140" rx="6" fill="#0D1B3E" stroke="url(#ob1-card)" stroke-width="1.5"/>
    <!-- 卡片内部装饰 -->
    <rect x="6" y="6" width="78" height="128" rx="4" fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.4"/>
    <!-- 星形符号 -->
    <polygon points="45,35 49,50 64,50 52,59 56,74 45,65 34,74 38,59 26,50 41,50"
             fill="#D4A843" opacity="0.8"/>
    <!-- 底部文字线 -->
    <line x1="20" y1="100" x2="70" y2="100" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <line x1="25" y1="110" x2="65" y2="110" stroke="#D4A843" stroke-width="0.5" opacity="0.3"/>
    <!-- 顶部编号 -->
    <text x="45" y="24" text-anchor="middle" font-family="Georgia, serif"
          font-size="12" fill="#F0D68A" opacity="0.7">XVII</text>
  </g>

  <!-- 散落的小卡片 -->
  <g transform="translate(60, 180) rotate(-15)">
    <rect x="0" y="0" width="55" height="85" rx="4" fill="#0D1B3E" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <circle cx="27.5" cy="42" r="10" fill="none" stroke="#D4A843" stroke-width="0.8" opacity="0.4"/>
  </g>

  <g transform="translate(240, 160) rotate(12)">
    <rect x="0" y="0" width="55" height="85" rx="4" fill="#0D1B3E" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <polygon points="27.5,25 30,35 40,35 32,41 35,51 27.5,45 20,51 23,41 15,35 25,35"
             fill="#D4A843" opacity="0.3"/>
  </g>

  <!-- 光芒线条 -->
  <line x1="187.5" y1="90" x2="187.5" y2="110" stroke="#D4A843" stroke-width="0.5" opacity="0.3"/>
  <line x1="150" y1="190" x2="130" y2="210" stroke="#D4A843" stroke-width="0.5" opacity="0.2"/>
  <line x1="225" y1="190" x2="245" y2="210" stroke="#D4A843" stroke-width="0.5" opacity="0.2"/>
</svg>