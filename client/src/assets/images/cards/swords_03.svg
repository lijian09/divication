<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg_swords_03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1B3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A2E;stop-opacity:1" />
    </linearGradient>

    <!-- 金色边框渐变 -->
    <linearGradient id="border_swords_03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D68A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0D68A;stop-opacity:1" />
    </linearGradient>

    <!-- 装饰图案 -->
    <pattern id="dots_swords_03" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#D4A843" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="640" fill="url(#bg_swords_03)"/>
  <rect width="400" height="640" fill="url(#dots_swords_03)"/>

  <!-- 金色边框 -->
  <rect x="4" y="4" width="392" height="632" rx="8" ry="8"
        fill="none" stroke="url(#border_swords_03)" stroke-width="2"/>
  <rect x="12" y="12" width="376" height="616" rx="5" ry="5"
        fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 顶部装饰线 -->
  <line x1="50" y1="60" x2="350" y2="60" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 顶部编号 -->
  <text x="200" y="45" text-anchor="middle" font-family="Georgia, serif"
        font-size="24" fill="#F0D68A" font-weight="bold" letter-spacing="3">
    3
  </text>

  <!-- 中央符号区域 -->
  <g transform="translate(0, 20)">
    
      <line x1="200" y1="205" x2="200" y2="250" stroke="#8A9BB0" stroke-width="3"/>
      <polygon points="200,205 195,215 205,215" fill="#8A9BB0" opacity="0.8"/>
      <line x1="190" y1="235" x2="210" y2="235" stroke="#8A9BB0" stroke-width="2"/>
    
      <line x1="165" y1="275" x2="165" y2="320" stroke="#8A9BB0" stroke-width="3"/>
      <polygon points="165,275 160,285 170,285" fill="#8A9BB0" opacity="0.8"/>
      <line x1="155" y1="305" x2="175" y2="305" stroke="#8A9BB0" stroke-width="2"/>
    
      <line x1="235" y1="275" x2="235" y2="320" stroke="#8A9BB0" stroke-width="3"/>
      <polygon points="235,275 230,285 240,285" fill="#8A9BB0" opacity="0.8"/>
      <line x1="225" y1="305" x2="245" y2="305" stroke="#8A9BB0" stroke-width="2"/>
    
  </g>

  <!-- 底部装饰线 -->
  <line x1="50" y1="550" x2="350" y2="550" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 底部中文牌名 -->
  <text x="200" y="585" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="18" fill="#F0D68A" font-weight="500" letter-spacing="4">
    Three of 宝剑
  </text>

  <!-- 底部英文牌名 -->
  <text x="200" y="610" text-anchor="middle" font-family="Georgia, serif"
        font-size="10" fill="#D4A843" opacity="0.7" letter-spacing="1">
    Three of Swords
  </text>

  <!-- 角落装饰 -->
  <circle cx="25" cy="25" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="375" cy="25" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="25" cy="615" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="375" cy="615" r="3" fill="#D4A843" opacity="0.5"/>
</svg>