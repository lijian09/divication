<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 400" width="375" height="400">
  <defs>
    <linearGradient id="ob3-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1B3E;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="ob3-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="ob3-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F0D68A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="375" height="400" fill="url(#ob3-bg)"/>
  <rect width="375" height="400" fill="url(#ob3-glow)"/>

  <!-- 星星装饰 -->
  <circle cx="60" cy="50" r="1.2" fill="#F0D68A" opacity="0.6"/>
  <circle cx="310" cy="60" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="150" cy="40" r="0.8" fill="#F0D68A" opacity="0.4"/>
  <circle cx="250" cy="45" r="1.3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="40" cy="150" r="1" fill="#F0D68A" opacity="0.3"/>
  <circle cx="340" cy="140" r="0.8" fill="#FFFFFF" opacity="0.4"/>

  <!-- 手部轮廓 - 洗牌手势 -->
  <g transform="translate(120, 80)" opacity="0.6">
    <!-- 简化的手形 -->
    <path d="M65 100 Q55 80 50 60 Q48 50 52 45 L55 40 Q58 35 62 38 L63 50
             Q65 35 68 30 Q72 25 76 30 L76 50
             Q78 35 82 30 Q86 25 90 30 L88 55
             Q90 40 95 38 Q100 36 102 42 L98 70
             Q100 65 105 65 Q110 65 110 75 L108 100 Q105 110 95 112 L70 112 Q58 110 55 105Z"
          fill="none" stroke="#D4A843" stroke-width="1.2"/>
  </g>

  <!-- 散落的塔罗牌 -->
  <g transform="translate(80, 180) rotate(-20)">
    <rect x="0" y="0" width="50" height="78" rx="4" fill="#0D1B3E" stroke="#D4A843" stroke-width="0.8" opacity="0.6"/>
    <polygon points="25,20 28,30 38,30 30,36 33,46 25,40 17,46 20,36 12,30 22,30"
             fill="#D4A843" opacity="0.4"/>
  </g>

  <g transform="translate(140, 170) rotate(-5)">
    <rect x="0" y="0" width="50" height="78" rx="4" fill="#0D1B3E" stroke="#D4A843" stroke-width="1" opacity="0.8"/>
    <polygon points="25,20 28,30 38,30 30,36 33,46 25,40 17,46 20,36 12,30 22,30"
             fill="#D4A843" opacity="0.5"/>
  </g>

  <g transform="translate(200, 175) rotate(8)">
    <rect x="0" y="0" width="50" height="78" rx="4" fill="#0D1B3E" stroke="#D4A843" stroke-width="0.8" opacity="0.6"/>
    <circle cx="25" cy="38" r="12" fill="none" stroke="#D4A843" stroke-width="0.8" opacity="0.4"/>
  </g>

  <g transform="translate(250, 185) rotate(18)">
    <rect x="0" y="0" width="50" height="78" rx="4" fill="#0D1B3E" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <polygon points="25,25 28,35 38,35 30,41 33,51 25,45 17,51 20,41 12,35 22,35"
             fill="#D4A843" opacity="0.3"/>
  </g>

  <!-- CTA 按钮 -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="175" height="44" rx="22" fill="url(#ob3-btn)"/>
    <text x="87.5" y="28" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
          font-size="15" font-weight="600" fill="#1A0A2E" letter-spacing="3">
      开始占卜
    </text>
  </g>

  <!-- 向下箭头指示 -->
  <g transform="translate(187.5, 370)" opacity="0.4">
    <path d="M-6 0 L0 6 L6 0" fill="none" stroke="#D4A843" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>