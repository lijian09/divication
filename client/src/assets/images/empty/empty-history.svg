<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="eh-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 背景光晕 -->
  <rect width="200" height="200" fill="url(#eh-glow)"/>

  <!-- 牌堆 - 三张叠放的卡片 -->
  <g transform="translate(60, 30)">
    <!-- 底层卡片 -->
    <rect x="8" y="8" width="55" height="85" rx="4" fill="#0D1B3E" stroke="#6B6580" stroke-width="0.8" opacity="0.3"/>
    <!-- 中层卡片 -->
    <rect x="4" y="4" width="55" height="85" rx="4" fill="#0D1B3E" stroke="#6B6580" stroke-width="0.8" opacity="0.5"/>
    <!-- 顶层卡片 -->
    <rect x="0" y="0" width="55" height="85" rx="4" fill="#0D1B3E" stroke="#A8A3B8" stroke-width="1"/>
    <!-- 问号符号 -->
    <text x="27.5" y="50" text-anchor="middle" font-family="Georgia, serif"
          font-size="28" fill="#A8A3B8" opacity="0.5">?</text>
  </g>

  <!-- 提示文字 -->
  <text x="100" y="145" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="13" fill="#A8A3B8" opacity="0.7">
    暂无历史记录
  </text>
  <text x="100" y="165" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="11" fill="#6B6580" opacity="0.5">
    开始你的第一次占卜吧
  </text>

  <!-- 装饰小星星 -->
  <circle cx="45" cy="50" r="1" fill="#D4A843" opacity="0.3"/>
  <circle cx="160" cy="60" r="1.2" fill="#F0D68A" opacity="0.25"/>
  <circle cx="35" cy="120" r="0.8" fill="#D4A843" opacity="0.2"/>
  <circle cx="170" cy="130" r="1" fill="#F0D68A" opacity="0.2"/>
</svg>