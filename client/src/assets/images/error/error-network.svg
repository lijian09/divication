<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="en-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E53935;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#E53935;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="200" height="200" fill="url(#en-glow)"/>

  <!-- WiFi 信号断开 -->
  <g transform="translate(100, 80)">
    <!-- 信号弧线 (断开效果) -->
    <path d="M-35 10 A50 50 0 0 1 35 10" fill="none" stroke="#A8A3B8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M-25 20 A35 35 0 0 1 25 20" fill="none" stroke="#A8A3B8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M-15 30 A20 20 0 0 1 15 30" fill="none" stroke="#A8A3B8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- 中心点 -->
    <circle cx="0" cy="40" r="4" fill="#A8A3B8" opacity="0.7"/>

    <!-- 断开的 X 号 -->
    <line x1="25" y1="-5" x2="40" y2="10" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="-5" x2="25" y2="10" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 提示文字 -->
  <text x="100" y="150" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="13" fill="#A8A3B8" opacity="0.7">
    网络连接失败
  </text>
  <text x="100" y="170" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="11" fill="#6B6580" opacity="0.5">
    请检查网络设置后重试
  </text>
</svg>