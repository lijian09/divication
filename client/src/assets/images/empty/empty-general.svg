<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="eg-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="eg-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D68A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- 背景光晕 -->
  <rect width="200" height="200" fill="url(#eg-glow)"/>

  <!-- 大星形 -->
  <g transform="translate(100, 75)">
    <!-- 外圈 -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.2"/>
    <!-- 四角星 -->
    <polygon points="0,-28 6,-10 24,-18 12,-2 30,0 12,6 24,20 6,12 0,30 -6,12 -24,20 -12,6 -30,0 -12,-2 -24,-18 -6,-10"
             fill="none" stroke="url(#eg-star)" stroke-width="1.2" opacity="0.6"/>
    <!-- 中心 -->
    <circle cx="0" cy="0" r="5" fill="#D4A843" opacity="0.3"/>
  </g>

  <!-- 提示文字 -->
  <text x="100" y="140" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="13" fill="#A8A3B8" opacity="0.7">
    这里空空如也
  </text>
  <text x="100" y="160" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="11" fill="#6B6580" opacity="0.5">
    暂无相关数据
  </text>

  <!-- 装饰粒子 -->
  <circle cx="40" cy="50" r="1" fill="#D4A843" opacity="0.2"/>
  <circle cx="165" cy="45" r="1.2" fill="#F0D68A" opacity="0.2"/>
  <circle cx="50" cy="110" r="0.8" fill="#D4A843" opacity="0.15"/>
  <circle cx="155" cy="100" r="1" fill="#F0D68A" opacity="0.15"/>
</svg>