<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 400" width="375" height="400">
  <defs>
    <linearGradient id="ob2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1B3E;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="ob2-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#D4A843;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#D4A843;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="375" height="400" fill="url(#ob2-bg)"/>
  <rect width="375" height="400" fill="url(#ob2-glow)"/>

  <!-- 网格线装饰 -->
  <g stroke="#D4A843" stroke-width="0.3" opacity="0.1">
    <line x1="0" y1="100" x2="375" y2="100"/>
    <line x1="0" y1="200" x2="375" y2="200"/>
    <line x1="0" y1="300" x2="375" y2="300"/>
    <line x1="94" y1="0" x2="94" y2="400"/>
    <line x1="187.5" y1="0" x2="187.5" y2="400"/>
    <line x1="281" y1="0" x2="281" y2="400"/>
  </g>

  <!-- AI 光环 -->
  <circle cx="187.5" cy="170" r="80" fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.15"/>
  <circle cx="187.5" cy="170" r="60" fill="none" stroke="#D4A843" stroke-width="0.8" opacity="0.2"/>
  <circle cx="187.5" cy="170" r="40" fill="none" stroke="#F0D68A" stroke-width="1" opacity="0.25"/>

  <!-- 中心 AI 符号 - 星形电路 -->
  <g transform="translate(187.5, 170)">
    <!-- 核心 -->
    <polygon points="0,-20 5,-7 18,-14 10,-2 22,0 10,5 18,16 5,9 0,22 -5,9 -18,16 -10,5 -22,0 -10,-2 -18,-14 -5,-7"
             fill="none" stroke="#D4A843" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="6" fill="#D4A843" opacity="0.6"/>
    <circle cx="0" cy="0" r="3" fill="#F0D68A" opacity="0.8"/>

    <!-- 连接线 -->
    <line x1="0" y1="-20" x2="0" y2="-35" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="0" x2="37" y2="0" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <line x1="0" y1="22" x2="0" y2="37" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>
    <line x1="-22" y1="0" x2="-37" y2="0" stroke="#D4A843" stroke-width="0.8" opacity="0.5"/>

    <!-- 节点 -->
    <circle cx="0" cy="-37" r="3" fill="#F0D68A" opacity="0.5"/>
    <circle cx="37" cy="0" r="3" fill="#F0D68A" opacity="0.5"/>
    <circle cx="0" cy="37" r="3" fill="#F0D68A" opacity="0.5"/>
    <circle cx="-37" cy="0" r="3" fill="#F0D68A" opacity="0.5"/>
  </g>

  <!-- 解读文字气泡 -->
  <g transform="translate(100, 260)">
    <rect x="0" y="0" width="175" height="60" rx="8" fill="#0D1B3E" stroke="#D4A843" stroke-width="0.8" opacity="0.7"/>
    <line x1="15" y1="18" x2="120" y2="18" stroke="#F0D68A" stroke-width="1" opacity="0.4"/>
    <line x1="15" y1="30" x2="100" y2="30" stroke="#F0D68A" stroke-width="0.8" opacity="0.3"/>
    <line x1="15" y1="42" x2="80" y2="42" stroke="#F0D68A" stroke-width="0.6" opacity="0.2"/>
  </g>

  <!-- 装饰粒子 -->
  <circle cx="80" cy="120" r="2" fill="#D4A843" opacity="0.3"/>
  <circle cx="290" cy="140" r="1.5" fill="#F0D68A" opacity="0.25"/>
  <circle cx="100" cy="240" r="1" fill="#D4A843" opacity="0.2"/>
  <circle cx="270" cy="250" r="1.5" fill="#F0D68A" opacity="0.2"/>
  <circle cx="60" cy="180" r="1" fill="#D4A843" opacity="0.15"/>
  <circle cx="310" cy="200" r="1.2" fill="#F0D68A" opacity="0.2"/>
</svg>