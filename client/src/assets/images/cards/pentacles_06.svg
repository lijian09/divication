<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg_pentacles_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1B3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A2E;stop-opacity:1" />
    </linearGradient>

    <!-- 金色边框渐变 -->
    <linearGradient id="border_pentacles_06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D68A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0D68A;stop-opacity:1" />
    </linearGradient>

    <!-- 装饰图案 -->
    <pattern id="dots_pentacles_06" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#D4A843" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="640" fill="url(#bg_pentacles_06)"/>
  <rect width="400" height="640" fill="url(#dots_pentacles_06)"/>

  <!-- 金色边框 -->
  <rect x="4" y="4" width="392" height="632" rx="8" ry="8"
        fill="none" stroke="url(#border_pentacles_06)" stroke-width="2"/>
  <rect x="12" y="12" width="376" height="616" rx="5" ry="5"
        fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 顶部装饰线 -->
  <line x1="50" y1="60" x2="350" y2="60" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 顶部编号 -->
  <text x="200" y="45" text-anchor="middle" font-family="Georgia, serif"
        font-size="24" fill="#F0D68A" font-weight="bold" letter-spacing="3">
    6
  </text>

  <!-- 中央符号区域 -->
  <g transform="translate(0, 20)">
    
      <circle cx="170" cy="235" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="170,225.4 174,231.8 179.6,231.8 175.6,237.4 177.2,244.6 170,240.6 162.8,244.6 164.4,237.4 160.4,231.8 166,231.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="230" cy="235" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="230,225.4 234,231.8 239.6,231.8 235.6,237.4 237.2,244.6 230,240.6 222.8,244.6 224.4,237.4 220.4,231.8 226,231.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="170" cy="280" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="170,270.4 174,276.8 179.6,276.8 175.6,282.4 177.2,289.6 170,285.6 162.8,289.6 164.4,282.4 160.4,276.8 166,276.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="230" cy="280" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="230,270.4 234,276.8 239.6,276.8 235.6,282.4 237.2,289.6 230,285.6 222.8,289.6 224.4,282.4 220.4,276.8 226,276.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="170" cy="325" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="170,315.4 174,321.8 179.6,321.8 175.6,327.4 177.2,334.6 170,330.6 162.8,334.6 164.4,327.4 160.4,321.8 166,321.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="230" cy="325" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="230,315.4 234,321.8 239.6,321.8 235.6,327.4 237.2,334.6 230,330.6 222.8,334.6 224.4,327.4 220.4,321.8 226,321.8"
               fill="#6B9E4A" opacity="0.5"/>
    
  </g>

  <!-- 底部装饰线 -->
  <line x1="50" y1="550" x2="350" y2="550" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 底部中文牌名 -->
  <text x="200" y="585" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="18" fill="#F0D68A" font-weight="500" letter-spacing="4">
    Six of 星币
  </text>

  <!-- 底部英文牌名 -->
  <text x="200" y="610" text-anchor="middle" font-family="Georgia, serif"
        font-size="10" fill="#D4A843" opacity="0.7" letter-spacing="1">
    Six of Pentacles
  </text>

  <!-- 角落装饰 -->
  <circle cx="25" cy="25" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="375" cy="25" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="25" cy="615" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="375" cy="615" r="3" fill="#D4A843" opacity="0.5"/>
</svg>