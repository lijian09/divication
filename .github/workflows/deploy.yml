# ==========================================================
# Deploy — 自动构建 Docker 镜像 + 推送 + 部署服务器
# 触发：仅 master 分支 push（CI 通过后）
# ==========================================================
name: Deploy

on:
  push:
    branches: [master]

# 依赖 CI 工作流先跑通
jobs:
  # ---------- 等待 CI 通过 ----------
  ci-pass:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI checks passed, proceeding to deploy."

  # ---------- 构建 & 推送 Docker 镜像 ----------
  build-image:
    name: Build & Push Image
    needs: ci-pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/lingyu-server

    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- SSH 部署到服务器 ----------
  deploy:
    name: Deploy to Server
    needs: build-image
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/lingyu-server

    steps:
      - uses: actions/checkout@v4

      - name: 复制配置文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "server/docker-compose.yml,server/docker/"
          target: /opt/lingyu/
          strip_components: 1

      - name: SSH 部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA,GITHUB_ACTOR
          script: |
            set -e

            cd /opt/lingyu

            # 登录 ghcr.io 拉取私有镜像
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

            # 拉取最新镜像
            docker pull $REGISTRY/$IMAGE_NAME:latest

            # 停止旧容器、启动新容器（保留 mysql/redis 数据卷）
            docker compose down app
            docker compose up -d app

            # 清理悬空镜像
            docker image prune -f

            echo "=== 部署完成 ==="
            echo "镜像: $REGISTRY/$IMAGE_NAME:latest"
            echo "提交: $GITHUB_SHA"

      - name: 健康检查
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "等待服务启动..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ 服务健康检查通过"
                exit 0
              fi
              sleep 2
            done
            echo "❌ 健康检查超时，服务可能未正常启动"
            docker compose logs app --tail 50
            exit 1
