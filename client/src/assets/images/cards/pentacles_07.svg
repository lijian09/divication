<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg_pentacles_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A0A2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0D1B3E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0A2E;stop-opacity:1" />
    </linearGradient>

    <!-- 金色边框渐变 -->
    <linearGradient id="border_pentacles_07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D68A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A843;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0D68A;stop-opacity:1" />
    </linearGradient>

    <!-- 装饰图案 -->
    <pattern id="dots_pentacles_07" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#D4A843" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="640" fill="url(#bg_pentacles_07)"/>
  <rect width="400" height="640" fill="url(#dots_pentacles_07)"/>

  <!-- 金色边框 -->
  <rect x="4" y="4" width="392" height="632" rx="8" ry="8"
        fill="none" stroke="url(#border_pentacles_07)" stroke-width="2"/>
  <rect x="12" y="12" width="376" height="616" rx="5" ry="5"
        fill="none" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 顶部装饰线 -->
  <line x1="50" y1="60" x2="350" y2="60" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 顶部编号 -->
  <text x="200" y="45" text-anchor="middle" font-family="Georgia, serif"
        font-size="24" fill="#F0D68A" font-weight="bold" letter-spacing="3">
    7
  </text>

  <!-- 中央符号区域 -->
  <g transform="translate(0, 20)">
    
      <circle cx="200" cy="230" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="200,220.4 204,226.8 209.6,226.8 205.6,232.4 207.2,239.6 200,235.6 192.8,239.6 194.4,232.4 190.4,226.8 196,226.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="170" cy="260" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="170,250.4 174,256.8 179.6,256.8 175.6,262.4 177.2,269.6 170,265.6 162.8,269.6 164.4,262.4 160.4,256.8 166,256.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="230" cy="260" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="230,250.4 234,256.8 239.6,256.8 235.6,262.4 237.2,269.6 230,265.6 222.8,269.6 224.4,262.4 220.4,256.8 226,256.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="200" cy="280" r="13.5" fill="none" stroke="#6B9E4A" stroke-width="1.8"/>
      <polygon points="200,269.2 204.5,276.4 210.8,276.4 206.3,282.7 208.1,290.8 200,286.3 191.9,290.8 193.7,282.7 189.2,276.4 195.5,276.4"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="170" cy="300" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="170,290.4 174,296.8 179.6,296.8 175.6,302.4 177.2,309.6 170,305.6 162.8,309.6 164.4,302.4 160.4,296.8 166,296.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="230" cy="300" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="230,290.4 234,296.8 239.6,296.8 235.6,302.4 237.2,309.6 230,305.6 222.8,309.6 224.4,302.4 220.4,296.8 226,296.8"
               fill="#6B9E4A" opacity="0.5"/>
    
      <circle cx="200" cy="330" r="12" fill="none" stroke="#6B9E4A" stroke-width="1.6"/>
      <polygon points="200,320.4 204,326.8 209.6,326.8 205.6,332.4 207.2,339.6 200,335.6 192.8,339.6 194.4,332.4 190.4,326.8 196,326.8"
               fill="#6B9E4A" opacity="0.5"/>
    
  </g>

  <!-- 底部装饰线 -->
  <line x1="50" y1="550" x2="350" y2="550" stroke="#D4A843" stroke-width="0.5" opacity="0.5"/>

  <!-- 底部中文牌名 -->
  <text x="200" y="585" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif"
        font-size="18" fill="#F0D68A" font-weight="500" letter-spacing="4">
    Seven of 星币
  </text>

  <!-- 底部英文牌名 -->
  <text x="200" y="610" text-anchor="middle" font-family="Georgia, serif"
        font-size="10" fill="#D4A843" opacity="0.7" letter-spacing="1">
    Seven of Pentacles
  </text>

  <!-- 角落装饰 -->
  <circle cx="25" cy="25" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="375" cy="25" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="25" cy="615" r="3" fill="#D4A843" opacity="0.5"/>
  <circle cx="375" cy="615" r="3" fill="#D4A843" opacity="0.5"/>
</svg>